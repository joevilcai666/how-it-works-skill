name: Feature request
description: Explain a product problem and a concrete improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Use fictional examples. Keep the shared workflow portable. Do not attach private repository data."
  - type: textarea
    id: problem
    attributes:
      label: Product problem
      description: Who needs this change, and what can they not understand or do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected visible result
      description: Describe one concrete synthetic before-and-after example.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and permission needs
      description: Explain how to check the result and any added access, external effect, or client dependency.
    validations:
      required: true
